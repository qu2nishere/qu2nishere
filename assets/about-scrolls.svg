<svg width="850" height="270" viewBox="0 0 850 270" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff1b8"/><stop offset="45%" stop-color="#e6b84a"/><stop offset="100%" stop-color="#9c6b1c"/>
    </linearGradient>
    <linearGradient id="parch" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4e6c2"/><stop offset="60%" stop-color="#e6d09c"/><stop offset="100%" stop-color="#cfb47a"/>
    </linearGradient>
    <linearGradient id="roll" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b8935a"/><stop offset="45%" stop-color="#f0dcae"/><stop offset="100%" stop-color="#8a6a3a"/>
    </linearGradient>
    <linearGradient id="rollv" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8a6a3a"/><stop offset="45%" stop-color="#f0dcae"/><stop offset="100%" stop-color="#8a6a3a"/>
    </linearGradient>
    <pattern id="bricks" width="24" height="12" patternUnits="userSpaceOnUse">
      <rect width="24" height="12" fill="#25242c"/>
      <path d="M0 0.5H24M0 6.5H24M0.5 0V6M12.5 6V12" stroke="#1a1a20" stroke-width="1"/>
    </pattern>
    <pattern id="bricks-lit" width="24" height="12" patternUnits="userSpaceOnUse">
      <rect width="24" height="12" fill="#3a3a46"/>
      <path d="M0 0.5H24M0 6.5H24M0.5 0V6M12.5 6V12" stroke="#262631" stroke-width="1"/>
    </pattern>
    <pattern id="merlons" width="14" height="10" patternUnits="userSpaceOnUse">
      <rect width="8" height="10" fill="#3a3a46"/>
    </pattern>
    <radialGradient id="torch-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb347" stop-opacity="0.7"/><stop offset="100%" stop-color="#ff6a00" stop-opacity="0"/>
    </radialGradient>
    <filter id="drop" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
</defs>
  <style>
    .serif { font-family: Georgia, 'Palatino Linotype', 'Book Antiqua', 'Times New Roman', serif; }
    .flicker { animation: flick 1.8s ease-in-out infinite; }
    .flicker2 { animation: flick 2.3s ease-in-out infinite 0.4s; }
    @keyframes flick { 0%,100% { opacity: 1; } 30% { opacity: 0.7; } 55% { opacity: 0.95; } 75% { opacity: 0.8; } }
    .flame { transform-box: fill-box; transform-origin: 50% 100%; animation: flame 0.5s ease-in-out infinite alternate; }
    @keyframes flame { from { transform: scale(1,1); } to { transform: scale(0.85,1.2); } }
</style>
