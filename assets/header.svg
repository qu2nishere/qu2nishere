<svg width="850" height="340" viewBox="0 0 850 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="space-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#180C05"/>
      <stop offset="60%" stop-color="#0E0603"/>
      <stop offset="100%" stop-color="#050201"/>
    </radialGradient>

    <!-- Glowing Orbs Gradients -->
    <radialGradient id="orb-orange-1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF5D00" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#FF8A00" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FF5D00" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb-orange-2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFA826" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#FF6A00" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FF4500" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb-gold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFCA28" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#FF6A00" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FF3D00" stop-opacity="0"/>
    </radialGradient>

    <!-- Glass Surface Fill -->
    <linearGradient id="glass-fill" x1="0" y1="0" x2="810" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.09"/>
      <stop offset="25%" stop-color="#FF7A00" stop-opacity="0.05"/>
      <stop offset="70%" stop-color="#150A05" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#0C0502" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Glass Border Gradient (Refraction Edge) -->
    <linearGradient id="glass-border" x1="0" y1="0" x2="810" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFB366" stop-opacity="0.9"/>
      <stop offset="25%" stop-color="#FFFFFF" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#FF6A00" stop-opacity="0.2"/>
      <stop offset="75%" stop-color="#FFA040" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#FF5722" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Shimmer linear gradient -->
    <linearGradient id="shimmer-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Text Gradients -->
    <linearGradient id="text-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#FFE0B2"/>
      <stop offset="100%" stop-color="#FFA726"/>
    </linearGradient>

    <!-- Drop Shadows & Glow Filters -->
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000000" flood-opacity="0.7"/>
      <feDropShadow dx="0" dy="4" stdDeviation="30" flood-color="#FF5D00" flood-opacity="0.25"/>
    </filter>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .title-text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-weight: 800; font-size: 35px; letter-spacing: -0.5px; }
    .subtitle-text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-weight: 400; font-size: 15px; fill: #D7C4B7; }
    .badge-text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-weight: 600; font-size: 12px; }
    .code-font { font-family: 'Consolas', 'Fira Code', monospace; font-size: 13px; }

    /* Keyframe Animations */
    @keyframes floatOrb1 {
      0%, 100% { transform: translate(0px, 0px) scale(1); }
      50% { transform: translate(35px, -18px) scale(1.1); }
    }
    @keyframes floatOrb2 {
      0%, 100% { transform: translate(0px, 0px) scale(1); }
      50% { transform: translate(-30px, 20px) scale(1.08); }
    }
    @keyframes floatOrb3 {
      0%, 100% { transform: translate(0px, 0px); }
      50% { transform: translate(20px, 15px); }
    }
    @keyframes pulseRing {
      0%, 100% { transform: scale(1); opacity: 0.35; }
      50% { transform: scale(1.05); opacity: 0.8; }
    }
    @keyframes rotateDash {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 60; }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }
    @keyframes sheenSweep {
      0% { transform: translateX(-400px) skewX(-20deg); }
      50%, 100% { transform: translateX(900px) skewX(-20deg); }
    }

    .anim-orb-1 { animation: floatOrb1 8s ease-in-out infinite; }
    .anim-orb-2 { animation: floatOrb2 10s ease-in-out infinite; }
    .anim-orb-3 { animation: floatOrb3 7s ease-in-out infinite; }
    .anim-ring {
      transform-origin: 65px 65px;
      animation: rotateDash 12s linear infinite;
    }
    .anim-pulse-dot {
      animation: blink 1.6s ease-in-out infinite;
    }
    .anim-sheen {
      animation: sheenSweep 6s ease-in-out infinite;
    }
  </style>

  <!-- Deep Canvas -->
  <rect width="850" height="340" rx="24" fill="url(#space-bg)"/>

  <!-- Animated Glowing Ambient Light Spheres (Behind Glass) -->
  <g class="anim-orb-1">
    <circle cx="150" cy="100" r="140" fill="url(#orb-orange-1)" opacity="0.65"/>
  </g>
  <g class="anim-orb-2">
    <circle cx="730" cy="190" r="160" fill="url(#orb-orange-2)" opacity="0.55"/>
  </g>
  <g class="anim-orb-3">
    <circle cx="450" cy="300" r="120" fill="url(#orb-gold)" opacity="0.4"/>
  </g>

  <!-- Main Floating Glassmorphic Panel -->
  <g filter="url(#card-shadow)">
    <rect x="20" y="20" width="810" height="300" rx="22" fill="url(#glass-fill)"/>
    <rect x="20" y="20" width="810" height="300" rx="22" stroke="url(#glass-border)" stroke-width="1.5"/>
  </g>

  <!-- Animated Specular Light Sheen across Glass -->
  <g clip-path="url(#glass-clip)">
    <clipPath id="glass-clip">
      <rect x="20" y="20" width="810" height="300" rx="22"/>
    </clipPath>
    <rect class="anim-sheen" x="0" y="20" width="180" height="300" fill="url(#shimmer-grad)" opacity="0.3"/>
  </g>

  <!-- Left: Glowing Holographic Avatar Glass Circle -->
  <g transform="translate(55, 75)">
    <!-- Rotating Dashed Orbit Ring -->
    <circle cx="65" cy="65" r="74" fill="none" stroke="#FFA726" stroke-width="1.5" stroke-dasharray="10 8" class="anim-ring" opacity="0.6"/>
    <!-- Outer Glass Ring -->
    <circle cx="65" cy="65" r="64" fill="#1A0D06" fill-opacity="0.6"/>
    <circle cx="65" cy="65" r="64" stroke="url(#glass-border)" stroke-width="2"/>
    
    <!-- Stylized Q Hologram Monogram -->
    <path d="M 65 35 C 50 35, 40 47, 40 65 C 40 83, 50 95, 65 95 C 72 95, 78 92, 83 86 L 91 94 L 97 88 L 88 80 C 91 76, 93 70, 93 65 C 93 47, 80 35, 65 35 Z M 65 48 C 74 48, 80 55, 80 65 C 80 75, 74 82, 65 82 C 56 82, 50 75, 50 65 C 50 55, 56 48, 65 48 Z" fill="url(#text-glow)" filter="url(#soft-glow)"/>

    <!-- Mini Live Status Badge on Avatar -->
    <circle cx="108" cy="110" r="11" fill="#140A05" stroke="#FF7A00" stroke-width="1.5"/>
    <circle cx="108" cy="110" r="6" fill="#00E676" class="anim-pulse-dot"/>
  </g>

  <!-- Right: Header Content -->
  <g transform="translate(235, 70)">
    <!-- Status / Role Pill -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="230" height="28" rx="14" fill="#FF6A00" fill-opacity="0.12" stroke="#FF8A00" stroke-width="1" stroke-opacity="0.45"/>
      <circle cx="14" cy="14" r="4" fill="#FF8A00" class="anim-pulse-dot" filter="url(#soft-glow)"/>
      <text x="26" y="18" class="badge-text" fill="#FFA726" letter-spacing="0.5">FULL-STACK DEVELOPER</text>
      <text x="185" y="18" class="badge-text" fill="#D7C4B7">● 2026</text>
    </g>

    <!-- Main Name Heading with Gradient -->
    <text x="0" y="70" class="title-text" fill="url(#text-glow)">
      Quân <tspan fill="#FF7B1A" font-weight="300">|</tspan> qu2nishere
    </text>

    <!-- Subtitle / Bio -->
    <text x="0" y="105" class="subtitle-text">
      Crafting modern high-speed web apps &amp; sleek glassmorphic digital experiences.
    </text>

    <!-- Modern Glass Floating Chips -->
    <g transform="translate(0, 134)">
      <!-- Chip 1 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="135" height="34" rx="10" fill="#FFFFFF" fill-opacity="0.05" stroke="url(#glass-border)" stroke-width="1"/>
        <text x="14" y="21" class="badge-text" fill="#FFB74D">⚡ Clean Code</text>
      </g>
      <!-- Chip 2 -->
      <g transform="translate(147, 0)">
        <rect x="0" y="0" width="150" height="34" rx="10" fill="#FFFFFF" fill-opacity="0.05" stroke="url(#glass-border)" stroke-width="1"/>
        <text x="14" y="21" class="badge-text" fill="#FFB74D">🎨 Modern UI/UX</text>
      </g>
      <!-- Chip 3 -->
      <g transform="translate(309, 0)">
        <rect x="0" y="0" width="135" height="34" rx="10" fill="#FFFFFF" fill-opacity="0.05" stroke="url(#glass-border)" stroke-width="1"/>
        <text x="14" y="21" class="badge-text" fill="#FFB74D">🚀 Fast Builder</text>
      </g>
    </g>

    <!-- Terminal Status Line -->
    <g transform="translate(0, 198)">
      <text x="0" y="0" class="code-font" fill="#8C786C">
        <tspan fill="#FF7A00">&gt;</tspan> echo <tspan fill="#FFE0B2">"Turning coffee &amp; passion into code"</tspan> <tspan fill="#FF7A00" class="anim-pulse-dot">_</tspan>
      </text>
    </g>
  </g>
</svg>
