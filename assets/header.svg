<svg width="850" height="320" viewBox="0 0 850 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="space-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1A0D06"/>
      <stop offset="60%" stop-color="#0E0704"/>
      <stop offset="100%" stop-color="#080402"/>
    </radialGradient>

    <!-- Glowing Orbs -->
    <radialGradient id="orb-orange-1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF5D00" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#FF8A00" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FF5D00" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb-orange-2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFA826" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#FF6A00" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FF4500" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb-gold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFCA28" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#FF6A00" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FF3D00" stop-opacity="0"/>
    </radialGradient>

    <!-- Glass Surface Fill -->
    <linearGradient id="glass-fill" x1="0" y1="0" x2="810" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="25%" stop-color="#FF7A00" stop-opacity="0.06"/>
      <stop offset="60%" stop-color="#1A0D06" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0F0804" stop-opacity="0.75"/>
    </linearGradient>

    <!-- Glass Border Gradient (Refraction Edge) -->
    <linearGradient id="glass-border" x1="0" y1="0" x2="810" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFB366" stop-opacity="0.85"/>
      <stop offset="20%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#FF6A00" stop-opacity="0.25"/>
      <stop offset="80%" stop-color="#FFA040" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FF4500" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Text Gradients -->
    <linearGradient id="text-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#FFE0B2"/>
      <stop offset="100%" stop-color="#FF9E44"/>
    </linearGradient>

    <linearGradient id="avatar-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8A00" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1A0D06" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Drop Shadows & Glow Filters -->
    <filter id="orange-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="4" stdDeviation="30" flood-color="#FF5D00" flood-opacity="0.2"/>
    </filter>
  </defs>

  <style>
    .title-text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-weight: 800; font-size: 34px; letter-spacing: -0.5px; }
    .subtitle-text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-weight: 400; font-size: 15px; fill: #D7C4B7; }
    .badge-text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-weight: 600; font-size: 12px; }
    .code-font { font-family: 'Consolas', 'Fira Code', monospace; font-size: 13px; }
    .pulse-dot {
      animation: pulse 2s infinite ease-in-out;
    }
    @keyframes pulse {
      0% { opacity: 0.6; transform: scale(0.95); }
      50% { opacity: 1; transform: scale(1.1); }
      100% { opacity: 0.6; transform: scale(0.95); }
    }
  </style>

  <!-- Canvas Deep Canvas -->
  <rect width="850" height="320" rx="24" fill="url(#space-bg)"/>

  <!-- Ambient Light Clouds (Behind Glass) -->
  <circle cx="160" cy="90" r="140" fill="url(#orb-orange-1)" opacity="0.6"/>
  <circle cx="720" cy="180" r="170" fill="url(#orb-orange-2)" opacity="0.45"/>
  <circle cx="480" cy="280" r="120" fill="url(#orb-gold)" opacity="0.35"/>

  <!-- Main Glassmorphic Panel -->
  <g filter="url(#card-shadow)">
    <rect x="20" y="20" width="810" height="280" rx="20" fill="url(#glass-fill)"/>
    <rect x="20" y="20" width="810" height="280" rx="20" stroke="url(#glass-border)" stroke-width="1.5"/>
  </g>

  <!-- Specular Reflection Sweep (Top Edge Sheen) -->
  <path d="M 22 40 C 22 29, 31 22, 42 22 L 700 22 C 450 48, 120 70, 22 130 Z" fill="#FFFFFF" opacity="0.04"/>

  <!-- Left: Glowing Avatar / Hex Hologram -->
  <g transform="translate(55, 60)">
    <!-- Avatar Outer Glow Circle -->
    <circle cx="65" cy="65" r="72" fill="none" stroke="#FF7A00" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.4"/>
    <circle cx="65" cy="65" r="62" fill="url(#avatar-glass)"/>
    <circle cx="65" cy="65" r="62" stroke="url(#glass-border)" stroke-width="2"/>
    
    <!-- Inner Glowing Core Symbol (Q monogram) -->
    <path d="M 65 35 C 50 35, 40 47, 40 65 C 40 83, 50 95, 65 95 C 72 95, 78 92, 83 86 L 91 94 L 97 88 L 88 80 C 91 76, 93 70, 93 65 C 93 47, 80 35, 65 35 Z M 65 47 C 74 47, 80 54, 80 65 C 80 75, 74 83, 65 83 C 56 83, 50 75, 50 65 C 50 54, 56 47, 65 47 Z" fill="url(#text-glow)" filter="url(#soft-glow)"/>

    <!-- Mini status badge on avatar -->
    <circle cx="108" cy="108" r="11" fill="#140A05" stroke="#FF7A00" stroke-width="1.5"/>
    <circle cx="108" cy="108" r="6" fill="#00E676" class="pulse-dot"/>
  </g>

  <!-- Right: Header Content -->
  <g transform="translate(230, 60)">
    <!-- Status / Role Pill -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="220" height="26" rx="13" fill="#FF6A00" fill-opacity="0.12" stroke="#FF8A00" stroke-width="1" stroke-opacity="0.4"/>
      <circle cx="14" cy="13" r="4" fill="#FF8A00" filter="url(#soft-glow)"/>
      <text x="26" y="17" class="badge-text" fill="#FFA726" letter-spacing="0.5">SOFTWARE DEVELOPER</text>
      <text x="175" y="17" class="badge-text" fill="#D7C4B7">● 2026</text>
    </g>

    <!-- Main Name Heading -->
    <text x="0" y="65" class="title-text" fill="url(#text-glow)">
      Quân <tspan fill="#FF7B1A" font-weight="400">|</tspan> qu2nishere
    </text>

    <!-- Subtitle / Bio -->
    <text x="0" y="98" class="subtitle-text">
      Passionate coder building sleek, high-performance &amp; modern digital applications.
    </text>

    <!-- Glass Chips / Highlights -->
    <g transform="translate(0, 126)">
      <!-- Chip 1: Clean Code -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="130" height="34" rx="10" fill="#FFFFFF" fill-opacity="0.05" stroke="url(#glass-border)" stroke-width="1"/>
        <text x="14" y="21" class="badge-text" fill="#FFB74D">⚡ Clean Code</text>
      </g>
      <!-- Chip 2: Modern Stack -->
      <g transform="translate(142, 0)">
        <rect x="0" y="0" width="145" height="34" rx="10" fill="#FFFFFF" fill-opacity="0.05" stroke="url(#glass-border)" stroke-width="1"/>
        <text x="14" y="21" class="badge-text" fill="#FFB74D">🔥 Glassmorphism</text>
      </g>
      <!-- Chip 3: Open to Learn -->
      <g transform="translate(299, 0)">
        <rect x="0" y="0" width="135" height="34" rx="10" fill="#FFFFFF" fill-opacity="0.05" stroke="url(#glass-border)" stroke-width="1"/>
        <text x="14" y="21" class="badge-text" fill="#FFB74D">🚀 Fast Builder</text>
      </g>
    </g>

    <!-- Terminal Status Line -->
    <g transform="translate(0, 185)">
      <text x="0" y="0" class="code-font" fill="#8C786C">
        <tspan fill="#FF7A00">&gt;</tspan> echo <tspan fill="#FFE0B2">"Turning coffee &amp; ideas into reality"</tspan> <tspan fill="#FF7A00" opacity="0.8">_</tspan>
      </text>
    </g>
  </g>
</svg>
