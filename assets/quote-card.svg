<svg width="850" height="120" viewBox="0 0 850 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff1b8"/><stop offset="45%" stop-color="#e6b84a"/><stop offset="100%" stop-color="#9c6b1c"/>
    </linearGradient>
    <linearGradient id="parch" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4e6c2"/><stop offset="60%" stop-color="#e6d09c"/><stop offset="100%" stop-color="#cfb47a"/>
    </linearGradient>
    <linearGradient id="roll" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b8935a"/><stop offset="45%" stop-color="#f0dcae"/><stop offset="100%" stop-color="#8a6a3a"/>
    </linearGradient>
    <linearGradient id="rollv" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8a6a3a"/><stop offset="45%" stop-color="#f0dcae"/><stop offset="100%" stop-color="#8a6a3a"/>
    </linearGradient>
    <pattern id="bricks" width="24" height="12" patternUnits="userSpaceOnUse">
      <rect width="24" height="12" fill="#25242c"/>
      <path d="M0 0.5H24M0 6.5H24M0.5 0V6M12.5 6V12" stroke="#1a1a20" stroke-width="1"/>
    </pattern>
    <pattern id="bricks-lit" width="24" height="12" patternUnits="userSpaceOnUse">
      <rect width="24" height="12" fill="#3a3a46"/>
      <path d="M0 0.5H24M0 6.5H24M0.5 0V6M12.5 6V12" stroke="#262631" stroke-width="1"/>
    </pattern>
    <pattern id="merlons" width="14" height="10" patternUnits="userSpaceOnUse">
      <rect width="8" height="10" fill="#3a3a46"/>
    </pattern>
    <radialGradient id="torch-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb347" stop-opacity="0.7"/><stop offset="100%" stop-color="#ff6a00" stop-opacity="0"/>
    </radialGradient>
    <filter id="drop" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
</defs>
  <g filter="url(#drop)">
    <path d="M60 22H790V96H60Z" fill="url(#parch)"/>
    <path d="M60 22H790" stroke="#a88a52" stroke-width="1"/>
    <path d="M60 96H790" stroke="#a88a52" stroke-width="1"/>
    <rect x="38" y="14" width="28" height="90" rx="12" fill="url(#rollv)"/>
    <rect x="784" y="14" width="28" height="90" rx="12" fill="url(#rollv)"/>
    <rect x="47" y="8" width="10" height="102" rx="4" fill="#5a3a1c"/>
    <rect x="793" y="8" width="10" height="102" rx="4" fill="#5a3a1c"/>
  </g>
  <text x="96" y="74" font-family="Georgia, 'Palatino Linotype', 'Book Antiqua', 'Times New Roman', serif" font-size="56" fill="#8b1a1a" opacity="0.55">“</text>
  <text x="420" y="58" text-anchor="middle" font-family="Georgia, 'Palatino Linotype', 'Book Antiqua', 'Times New Roman', serif" font-style="italic" font-size="18" fill="#3a2410">First, solve the problem. Then, write the code.</text>
  <text x="420" y="80" text-anchor="middle" font-family="Georgia, 'Palatino Linotype', 'Book Antiqua', 'Times New Roman', serif" font-size="12.5" letter-spacing="2" fill="#7a4a1c">— JOHN JOHNSON, SCRIBE OF THE REALM —</text>
  <!-- wax seal -->
  <g transform="translate(728 60)">
    <path d="M0 -22L6 -19L12 -20L15 -14L21 -11L20 -5L23 0L20 5L21 11L15 14L12 20L6 19L0 22L-6 19L-12 20L-15 14L-21 11L-20 5L-23 0L-20 -5L-21 -11L-15 -14L-12 -20L-6 -19Z" fill="#9c1b1b"/>
    <circle r="14" fill="#b71c1c" stroke="#7a1010" stroke-width="2"/>
    <text y="6" text-anchor="middle" font-family="Georgia, 'Palatino Linotype', 'Book Antiqua', 'Times New Roman', serif" font-weight="700" font-size="17" fill="#f1b0a0">Q</text>
    <path d="M-6 20L-10 34L-4 30L0 36L2 21Z" fill="#9c1b1b"/>
  </g>
