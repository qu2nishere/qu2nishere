<svg width="850" height="24" viewBox="0 0 850 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="divider-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6A00" stop-opacity="0"/>
      <stop offset="25%" stop-color="#FF6A00" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#FFA726" stop-opacity="0.9"/>
      <stop offset="75%" stop-color="#FF6A00" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FF6A00" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="center-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFA726" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#FF6A00" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FF6A00" stop-opacity="0"/>
    </radialGradient>
    <filter id="div-glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Glow at Center -->
  <circle cx="425" cy="12" r="12" fill="url(#center-glow)"/>

  <!-- Tapered Line -->
  <line x1="50" y1="12" x2="800" y2="12" stroke="url(#divider-grad)" stroke-width="1.5" stroke-linecap="round" filter="url(#div-glow)"/>

  <!-- Center Diamond Accent -->
  <g transform="translate(425, 12) rotate(45)">
    <rect x="-4" y="-4" width="8" height="8" rx="1.5" fill="#FFE082" stroke="#FF7A00" stroke-width="1"/>
  </g>
</svg>
