<svg width="850" height="150" viewBox="0 0 850 150" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Glass Fill -->
    <linearGradient id="panel-fill" x1="0" y1="0" x2="810" y2="130" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.09"/>
      <stop offset="35%" stop-color="#FF7A00" stop-opacity="0.05"/>
      <stop offset="80%" stop-color="#140904" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#0B0402" stop-opacity="0.90"/>
    </linearGradient>

    <!-- Glass Refraction Border -->
    <linearGradient id="panel-stroke" x1="0" y1="0" x2="810" y2="130" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFA845" stop-opacity="0.85"/>
      <stop offset="25%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="65%" stop-color="#FF6A00" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FF5722" stop-opacity="0.55"/>
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="panel-shadow" x="-5%" y="-15%" width="110%" height="135%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.65"/>
      <feDropShadow dx="0" dy="2" stdDeviation="8" flood-color="#FF6A00" flood-opacity="0.2"/>
    </filter>

    <!-- Text Glow -->
    <linearGradient id="val-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#FFE0B2"/>
      <stop offset="100%" stop-color="#FFA726"/>
    </linearGradient>
  </defs>

  <style>
    .hdr-title { font-family: 'Segoe UI', -apple-system, sans-serif; font-weight: 700; font-size: 13px; fill: #FFFFFF; letter-spacing: 0.5px; }
    .hdr-sub { font-family: 'Segoe UI', -apple-system, sans-serif; font-weight: 500; font-size: 11px; fill: #D7C4B7; }
    .metric-val { font-family: 'Segoe UI', -apple-system, sans-serif; font-weight: 800; font-size: 26px; }
    .metric-lbl { font-family: 'Segoe UI', -apple-system, sans-serif; font-weight: 700; font-size: 11px; fill: #FFA726; letter-spacing: 0.5px; }
    .metric-desc { font-family: 'Segoe UI', -apple-system, sans-serif; font-weight: 400; font-size: 10.5px; fill: #A89588; }
    .status-text { font-family: 'Consolas', 'Fira Code', monospace; font-size: 11px; fill: #FF9E44; }

    @keyframes pulseGlow {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }
    .pulse-dot { animation: pulseGlow 2s infinite ease-in-out; }
  </style>

  <!-- Ambient Light Orbs behind glass -->
  <circle cx="200" cy="75" r="80" fill="#FF5D00" opacity="0.18" filter="blur(25px)"/>
  <circle cx="650" cy="75" r="80" fill="#FFA726" opacity="0.15" filter="blur(25px)"/>

  <!-- Main Unified Glass Panel (No overlapping possible) -->
  <g transform="translate(20, 10)" filter="url(#panel-shadow)">
    <rect width="810" height="130" rx="18" fill="url(#panel-fill)"/>
    <rect width="810" height="130" rx="18" stroke="url(#panel-stroke)" stroke-width="1.3"/>

    <!-- Top Header Bar -->
    <g transform="translate(25, 24)">
      <circle cx="4" cy="4" r="4" fill="#00E676" class="pulse-dot"/>
      <text x="16" y="8" class="hdr-title">GITHUB DEVELOPER METRICS</text>
      <text x="760" y="8" class="hdr-sub" text-anchor="end">YEAR 2026 • LIVE SYNC</text>
    </g>

    <!-- Divider Line below header -->
    <line x1="25" y1="36" x2="785" y2="36" stroke="#FF7A00" stroke-opacity="0.15" stroke-width="1"/>

    <!-- 4 Balanced Columns -->
    <!-- Column 1: Total Contributions -->
    <g transform="translate(30, 48)">
      <text x="0" y="28" class="metric-val" fill="url(#val-glow)">282<tspan font-size="18" fill="#FFA726">+</tspan></text>
      <text x="0" y="44" class="metric-lbl">TOTAL COMMITS</text>
      <text x="0" y="58" class="metric-desc">Lifetime Contributions</text>
    </g>

    <!-- Vertical separator 1 -->
    <line x1="225" y1="48" x2="225" y2="108" stroke="#FF7A00" stroke-opacity="0.15" stroke-width="1"/>

    <!-- Column 2: Current Streak -->
    <g transform="translate(245, 48)">
      <text x="0" y="28" class="metric-val" fill="url(#val-glow)">3 <tspan font-size="18" fill="#FFE082">Days</tspan></text>
      <text x="0" y="44" class="metric-lbl">CURRENT STREAK</text>
      <text x="0" y="58" class="metric-desc">Daily Coding Flow</text>
    </g>

    <!-- Vertical separator 2 -->
    <line x1="420" y1="48" x2="420" y2="108" stroke="#FF7A00" stroke-opacity="0.15" stroke-width="1"/>

    <!-- Column 3: Longest Streak -->
    <g transform="translate(440, 48)">
      <text x="0" y="28" class="metric-val" fill="url(#val-glow)">8 <tspan font-size="18" fill="#FFE082">Days</tspan></text>
      <text x="0" y="44" class="metric-lbl">LONGEST STREAK</text>
      <text x="0" y="58" class="metric-desc">Peak Momentum</text>
    </g>

    <!-- Vertical separator 3 -->
    <line x1="615" y1="48" x2="615" y2="108" stroke="#FF7A00" stroke-opacity="0.15" stroke-width="1"/>

    <!-- Column 4: Dev Status -->
    <g transform="translate(635, 48)">
      <text x="0" y="28" class="metric-val" fill="#00E676" font-size="24">Active</text>
      <text x="0" y="44" class="metric-lbl">CONTRIBUTOR</text>
      <text x="0" y="58" class="metric-desc">Open to Collaborate</text>
    </g>
  </g>
</svg>
