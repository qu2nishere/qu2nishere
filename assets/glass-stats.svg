<svg width="850" height="195" viewBox="0 0 850 195" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Glass Fills -->
    <linearGradient id="st-glass-fill" x1="0" y1="0" x2="395" y2="165" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.09"/>
      <stop offset="35%" stop-color="#FF7A00" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#120804" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Glass Borders -->
    <linearGradient id="st-glass-stroke" x1="0" y1="0" x2="395" y2="165" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFA845" stop-opacity="0.85"/>
      <stop offset="25%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="65%" stop-color="#FF6A00" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FF5722" stop-opacity="0.55"/>
    </linearGradient>

    <linearGradient id="bar-fill-orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5D00"/>
      <stop offset="70%" stop-color="#FFA726"/>
      <stop offset="100%" stop-color="#FFE082"/>
    </linearGradient>

    <filter id="st-shadow" x="-10%" y="-15%" width="120%" height="135%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="2" stdDeviation="8" flood-color="#FF6A00" flood-opacity="0.2"/>
    </filter>

    <filter id="glow-fx" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .st-title { font-family: 'Segoe UI', -apple-system, sans-serif; font-weight: 700; font-size: 14px; fill: #FFFFFF; letter-spacing: 0.5px; }
    .st-sub { font-family: 'Segoe UI', -apple-system, sans-serif; font-weight: 400; font-size: 11px; fill: #B8A699; }
    .st-big-num { font-family: 'Segoe UI', -apple-system, sans-serif; font-weight: 900; font-size: 32px; fill: #FFA726; }
    .st-label { font-family: 'Segoe UI', -apple-system, sans-serif; font-weight: 600; font-size: 11.5px; fill: #E6D5CC; }

    @keyframes barAnim1 {
      0% { width: 0px; }
      100% { width: 310px; }
    }
    @keyframes barAnim2 {
      0% { width: 0px; }
      100% { width: 285px; }
    }
    @keyframes barAnim3 {
      0% { width: 0px; }
      100% { width: 260px; }
    }
    @keyframes flamePulse {
      0%, 100% { transform: scale(1); opacity: 0.85; }
      50% { transform: scale(1.12); opacity: 1; filter: drop-shadow(0 0 8px #FF6A00); }
    }
    @keyframes cardFloatLeft {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }
    @keyframes cardFloatRight {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }

    .card-l { animation: cardFloatLeft 6s ease-in-out infinite; }
    .card-r { animation: cardFloatRight 6.5s ease-in-out infinite 0.6s; }
    .pulse-flame {
      transform-origin: center;
      animation: flamePulse 2s ease-in-out infinite;
    }
  </style>

  <!-- Left Glass Card: Contribution Velocity -->
  <g class="card-l" transform="translate(20, 12)" filter="url(#st-shadow)">
    <rect width="395" height="165" rx="18" fill="url(#st-glass-fill)"/>
    <rect width="395" height="165" rx="18" stroke="url(#st-glass-stroke)" stroke-width="1.3"/>

    <!-- Header -->
    <g transform="translate(22, 26)">
      <circle cx="5" cy="5" r="4.5" fill="#FF7A00"/>
      <text x="16" y="9" class="st-title">CONTRIBUTION MOMENTUM</text>
      <text x="350" y="9" class="st-sub" text-anchor="end">YEAR 2026</text>
    </g>

    <!-- Big Number Showcase -->
    <g transform="translate(24, 75)">
      <text x="0" y="0" class="st-big-num">282<tspan font-size="20" fill="#FFE082">+</tspan></text>
      <text x="0" y="20" class="st-sub">LIFETIME CONTRIBUTIONS</text>

      <g transform="translate(190, -32)">
        <!-- Mini Badge -->
        <rect width="155" height="52" rx="10" fill="#FF6A00" fill-opacity="0.1" stroke="#FFA726" stroke-width="1" stroke-opacity="0.4"/>
        <text x="14" y="22" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="12" fill="#FFA726">🔥 LEVEL: ACTIVE</text>
        <text x="14" y="40" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#D7C4B7">Consistent Coder</text>
      </g>
    </g>

    <!-- Bottom Highlights -->
    <g transform="translate(24, 138)">
      <text x="0" y="0" font-family="'Consolas', monospace" font-size="11" fill="#FF9E44">
        &gt; status: <tspan fill="#FFFFFF">Daily Commit Velocity • High Consistency</tspan>
      </text>
    </g>
  </g>

  <!-- Right Glass Card: Domain Mastery -->
  <g class="card-r" transform="translate(435, 12)" filter="url(#st-shadow)">
    <rect width="395" height="165" rx="18" fill="url(#st-glass-fill)"/>
    <rect width="395" height="165" rx="18" stroke="url(#st-glass-stroke)" stroke-width="1.3"/>

    <!-- Header -->
    <g transform="translate(22, 26)">
      <circle cx="5" cy="5" r="4.5" fill="#FFA726"/>
      <text x="16" y="9" class="st-title">DOMAIN FOCUS &amp; VELOCITY</text>
      <text x="350" y="9" class="st-sub" text-anchor="end">BENCHMARK</text>
    </g>

    <!-- Skill 1: Full-Stack Web -->
    <g transform="translate(24, 60)">
      <text x="0" y="0" class="st-label">Full-Stack Development (React / Node / TS)</text>
      <text x="345" y="0" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#FFA726" text-anchor="end">94%</text>
      <!-- Track -->
      <rect x="0" y="7" width="345" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.08"/>
      <!-- Fill -->
      <rect x="0" y="7" width="324" height="6" rx="3" fill="url(#bar-fill-orange)" filter="url(#glow-fx)"/>
    </g>

    <!-- Skill 2: UI/UX & Glassmorphism -->
    <g transform="translate(24, 98)">
      <text x="0" y="0" class="st-label">UI/UX Design &amp; Glassmorphism</text>
      <text x="345" y="0" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#FFA726" text-anchor="end">96%</text>
      <rect x="0" y="7" width="345" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.08"/>
      <rect x="0" y="7" width="331" height="6" rx="3" fill="url(#bar-fill-orange)" filter="url(#glow-fx)"/>
    </g>

    <!-- Skill 3: Clean Code & Problem Solving -->
    <g transform="translate(24, 136)">
      <text x="0" y="0" class="st-label">Architecture, Clean Code &amp; DevOps</text>
      <text x="345" y="0" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#FFA726" text-anchor="end">88%</text>
      <rect x="0" y="7" width="345" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.08"/>
      <rect x="0" y="7" width="303" height="6" rx="3" fill="url(#bar-fill-orange)" filter="url(#glow-fx)"/>
    </g>
  </g>
</svg>

