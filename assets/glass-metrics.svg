<svg width="850" height="150" viewBox="0 0 850 150" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Deep Neutral Obsidian Glass Fill (NOT all orange) -->
    <linearGradient id="neutral-glass-fill" x1="0" y1="0" x2="810" y2="130" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.07"/>
      <stop offset="40%" stop-color="#141419" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#0A0A0E" stop-opacity="0.90"/>
    </linearGradient>

    <!-- Glass Refraction Border (Subtle white-silver, glowing orange only near top-right) -->
    <linearGradient id="glass-edge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="75%" stop-color="#FF9E44" stop-opacity="0.5"/>
      <stop offset="90%" stop-color="#FFA726" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FF5722" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Top-Right Spotlight / Ambient Glow -->
    <radialGradient id="top-right-spotlight" cx="90%" cy="0%" r="75%">
      <stop offset="0%" stop-color="#FFA826" stop-opacity="0.65"/>
      <stop offset="25%" stop-color="#FF6A00" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#FF5722" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FF5722" stop-opacity="0"/>
    </radialGradient>

    <!-- Directional Light Rays from Top-Right -->
    <linearGradient id="ray-grad-1" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#FF7A00" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FF5722" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="ray-grad-2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFA726" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#FF6A00" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#FF5722" stop-opacity="0"/>
    </linearGradient>

    <!-- Card Shadow -->
    <filter id="glass-shadow" x="-5%" y="-15%" width="110%" height="135%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.75"/>
      <feDropShadow dx="4" dy="-2" stdDeviation="14" flood-color="#FF7A00" flood-opacity="0.15"/>
    </filter>

    <!-- Value Glow -->
    <linearGradient id="text-grad-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F0EBE6"/>
      <stop offset="100%" stop-color="#FFA726"/>
    </linearGradient>
  </defs>

  <style>
    .hdr-tag { font-family: 'Segoe UI', -apple-system, sans-serif; font-weight: 700; font-size: 12px; fill: #D7D0CA; letter-spacing: 0.8px; }
    .hdr-live { font-family: 'Segoe UI', -apple-system, sans-serif; font-weight: 500; font-size: 11px; fill: #A8A099; }
    .val-num { font-family: 'Segoe UI', -apple-system, sans-serif; font-weight: 800; font-size: 27px; }
    .val-lbl { font-family: 'Segoe UI', -apple-system, sans-serif; font-weight: 700; font-size: 11px; fill: #FF9E44; letter-spacing: 0.5px; }
    .val-desc { font-family: 'Segoe UI', -apple-system, sans-serif; font-weight: 400; font-size: 10.5px; fill: #9E928A; }

    @keyframes pulseLive {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }
    @keyframes rayShimmer {
      0%, 100% { opacity: 0.18; }
      50% { opacity: 0.28; }
    }
    .pulse-dot { animation: pulseLive 2s infinite ease-in-out; }
    .anim-ray { animation: rayShimmer 4s ease-in-out infinite; }
  </style>

  <!-- Ambient Light Orbs ONLY at Top-Right (No overall orange background!) -->
  <circle cx="760" cy="15" r="160" fill="url(#top-right-spotlight)"/>

  <!-- Main Glassmorphic Container Panel -->
  <g transform="translate(20, 10)" filter="url(#glass-shadow)">
    <!-- Neutral Dark Obsidian Glass Base -->
    <rect width="810" height="130" rx="18" fill="url(#neutral-glass-fill)"/>

    <!-- Light Rays Streaming from Top-Right down to the left -->
    <g clip-path="url(#panel-clip)">
      <clipPath id="panel-clip">
        <rect width="810" height="130" rx="18"/>
      </clipPath>

      <!-- Ray Beam 1 -->
      <polygon class="anim-ray" points="750,0 810,0 620,130 520,130" fill="url(#ray-grad-1)"/>
      <!-- Ray Beam 2 -->
      <polygon points="680,0 720,0 480,130 420,130" fill="url(#ray-grad-2)" opacity="0.16"/>
      <!-- Ray Beam 3 (Ambient cone from top right corner) -->
      <polygon points="560,0 810,0 810,130 380,130" fill="url(#ray-grad-2)" opacity="0.12"/>

      <!-- Glowing Top-Right Specular Glass Edge Reflection -->
      <ellipse cx="780" cy="5" rx="100" ry="15" fill="#FFE0B2" opacity="0.25"/>
    </g>

    <!-- Glass Refraction Border with Top-Right Glow -->
    <rect width="810" height="130" rx="18" stroke="url(#glass-edge)" stroke-width="1.3"/>

    <!-- Top Header Bar -->
    <g transform="translate(28, 24)">
      <circle cx="4" cy="4" r="4" fill="#00E676" class="pulse-dot"/>
      <text x="16" y="8" class="hdr-tag">GITHUB DEVELOPER METRICS</text>
      <text x="755" y="8" class="hdr-live" text-anchor="end">YEAR 2026 • LIVE SYNC</text>
    </g>

    <!-- Subtle Glass Divider -->
    <line x1="28" y1="36" x2="782" y2="36" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>

    <!-- 4 Clean, Balanced Columns (NO OVERLAPPING, NO PROGRESS BARS) -->
    <!-- Column 1: Total Commits -->
    <g transform="translate(36, 48)">
      <text x="0" y="28" class="val-num" fill="url(#text-grad-light)">282<tspan font-size="18" fill="#FFA726">+</tspan></text>
      <text x="0" y="44" class="val-lbl">TOTAL COMMITS</text>
      <text x="0" y="58" class="val-desc">Lifetime Contributions</text>
    </g>

    <!-- Vertical Divider 1 -->
    <line x1="225" y1="48" x2="225" y2="108" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="1"/>

    <!-- Column 2: Current Streak -->
    <g transform="translate(250, 48)">
      <text x="0" y="28" class="val-num" fill="url(#text-grad-light)">3 <tspan font-size="18" fill="#FFA726">Days</tspan></text>
      <text x="0" y="44" class="val-lbl">CURRENT STREAK</text>
      <text x="0" y="58" class="val-desc">Daily Coding Flow</text>
    </g>

    <!-- Vertical Divider 2 -->
    <line x1="425" y1="48" x2="425" y2="108" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="1"/>

    <!-- Column 3: Longest Streak -->
    <g transform="translate(450, 48)">
      <text x="0" y="28" class="val-num" fill="url(#text-grad-light)">8 <tspan font-size="18" fill="#FFA726">Days</tspan></text>
      <text x="0" y="44" class="val-lbl">LONGEST STREAK</text>
      <text x="0" y="58" class="val-desc">Peak Velocity</text>
    </g>

    <!-- Vertical Divider 3 -->
    <line x1="620" y1="48" x2="620" y2="108" stroke="#FFA726" stroke-opacity="0.15" stroke-width="1"/>

    <!-- Column 4: Dev Status (Bathed in Top-Right Light Rays) -->
    <g transform="translate(645, 48)">
      <text x="0" y="28" class="val-num" fill="#00E676" font-size="24">Active</text>
      <text x="0" y="44" class="val-lbl">STATUS 2026</text>
      <text x="0" y="58" class="val-desc">Ready to Collaborate</text>
    </g>
  </g>
</svg>
