name: Generate Snake Contribution Grid

on:
  schedule:
    - cron: "0 */12 * * *" # Run every 12 hours
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Generate Orange Theme Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark&color_snake=#ff7a00&color_dots=#120a06,#3a1b0a,#7d330c,#c4530f,#ff7a00
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#ffa726&color_dots=#120a06,#3a1b0a,#7d330c,#c4530f,#ffa726

      - name: Push Snake SVG to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
